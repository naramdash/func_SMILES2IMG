name: Build & Release SMILES for Office

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Solution
        shell: pwsh
        run: |
          dotnet build Smiles2Img.sln -c Release -v minimal

      - name: Run Unit Test Suite
        shell: pwsh
        run: |
          ./tests/bin/Release/net48/Smiles2Img.Tests.exe

      - name: Package Release Archives
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/Package-Release.ps1

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/x64/Smiles2Img-Office-x64.zip
            dist/x86/Smiles2Img-Office-x86.zip
            dist/x64/Smiles2Img-AddIn64-packed.xll
            dist/x86/Smiles2Img-AddIn-packed.xll
            install.ps1
            uninstall.ps1
            THIRD_PARTY_NOTICES.md
          prerelease: ${{ contains(github.ref, '-preview') || contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
          generate_release_notes: true
