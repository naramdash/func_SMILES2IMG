name: Build & Release func_SMILES2IMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Solution
        shell: pwsh
        run: |
          dotnet build Smiles2Img.sln -c Release -v minimal

      - name: Run Unit Test Suite
        shell: pwsh
        run: |
          ./tests/bin/Release/net48/Smiles2Img.Tests.exe

      - name: Package Release Archives
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/Package-Release.ps1

      - name: Verify Installer Scripts (Encoding & Syntax)
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1', 'uninstall.ps1')) {
            $fullPath = (Resolve-Path $file).Path
            $bytes = [System.IO.File]::ReadAllBytes($fullPath)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$file contains a UTF-8 BOM (EF BB BF), which breaks 'irm ... | iex' in Windows PowerShell 5.1."
            }
            $lines = [System.IO.File]::ReadAllLines($fullPath, [System.Text.Encoding]::UTF8)
            for ($i = 0; $i -lt $lines.Length; $i++) {
              if ($lines[$i] -match '[^\x00-\x7F]') {
                throw ("$file contains non-ASCII character(s) at line $($i + 1): $($lines[$i]). Use " + '$([char]0xXXXX)' + " for non-ASCII output.")
              }
            }
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($fullPath, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "$file has PowerShell syntax error(s): $($errors[0].Message)"
            }
            Write-Host "[PASS] $file verified (BOM=False, NonAscii=0, ParseErrors=0)" -ForegroundColor Green
          }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/x64/func_SMILES2IMG-x64.zip
            dist/x86/func_SMILES2IMG-x86.zip
            dist/x64/Smiles2Img-AddIn64-packed.xll
            dist/x86/Smiles2Img-AddIn-packed.xll
            install.ps1
            uninstall.ps1
            THIRD_PARTY_NOTICES.md
          prerelease: ${{ contains(github.ref, '-preview') || contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
          generate_release_notes: true
